<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout('Configuración', ~{::main}, null)}">
<body>
<main id="main" class="app-content" tabindex="-1">
    <header th:replace="~{fragments/page-header :: page-header('Configuración', 'Datos de tu cuenta.')}"></header>

    <section class="card" aria-labelledby="accountTitle">
        <h2 id="accountTitle">Cuenta</h2>
        <dl class="definition-list">
            <dt>Nombre</dt>
            <dd sec:authentication="principal.displayName">Usuario Demo</dd>
            <dt>Correo electrónico</dt>
            <dd sec:authentication="name">demo@agrosense.co</dd>
        </dl>
    </section>

    <section class="card">
        <div th:replace="~{fragments/empty-state :: empty-state('bi-gear', 'Edición no disponible',
            'Cambiar el perfil, la contraseña y las preferencias aún no está implementado.')}"></div>
    </section>
</main>
</body>
</html>
