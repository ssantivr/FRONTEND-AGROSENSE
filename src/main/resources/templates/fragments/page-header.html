<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<header class="page-header" th:fragment="page-header(title, description)">
    <h1 th:text="${title}">Título</h1>
    <p th:text="${description}">Descripción</p>
</header>

<!-- Background photograph of a .hero band. `photo` is a file name in /img/photos without size or extension.
     Decorative, so its alt text is empty; credits are in /img/brand/CREDITS.md. -->
<img class="hero-photo" th:fragment="hero-photo(photo)" alt="" width="960" height="640" decoding="async"
     th:src="@{|/img/photos/${photo}-960.jpg|}"
     th:srcset="@{|/img/photos/${photo}-960.jpg|} + ' 960w, ' + @{|/img/photos/${photo}-1600.jpg|} + ' 1600w'"
     sizes="(min-width: 1024px) calc(100vw - 320px), 100vw">
</body>
</html>
