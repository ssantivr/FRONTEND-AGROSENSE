<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content, script)">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title th:text="|${title} · AgroSense|">AgroSense</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap-grid.min.css}">
    <link th:if="${script == 'dashboard' or script == 'sensor-map' or script == 'estate-map' or script == 'estate-detail'}" rel="stylesheet" th:href="@{/webjars/leaflet/1.9.4/leaflet.css}">
    <th:block th:replace="~{fragments/brand :: head-assets}"></th:block>
    <link rel="stylesheet" th:href="@{/css/ai-chat.css}">
</head>
<body>
<div class="brand-intro" id="brandIntro" aria-hidden="true">
    <svg class="brand-intro-mark" viewBox="0 0 48 48" width="72" height="72" focusable="false">
        <circle class="brand-intro-seed" cx="12" cy="36" r="4"/>
        <path class="brand-intro-leaf-2" d="M9 39C9 21 21 9 39 9L9 39Z"/>
        <path class="brand-intro-leaf" d="M9 39C27 39 39 27 39 9L9 39Z"/>
    </svg>
    <span class="brand-intro-name">Agro<span>Sense</span></span>
    <button type="button" class="brand-intro-skip" id="brandIntroSkip" tabindex="-1">Saltar</button>
</div>
<a class="skip-link" href="#main">Saltar al contenido</a>
<div class="app-shell" id="appShell">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
    <div class="sidebar-backdrop" aria-hidden="true"></div>
    <div class="app-main">
        <header th:replace="~{fragments/navbar :: navbar}"></header>
        <main th:replace="${content}"></main>
    </div>
</div>
<nav th:replace="~{fragments/bottom-nav :: bottom-nav}"></nav>
<dialog th:replace="~{fragments/confirm-modal :: confirm-modal}"></dialog>
<dialog th:replace="~{fragments/command-palette :: command-palette}"></dialog>
<div th:replace="~{fragments/toast :: toast}"></div>
<section th:replace="~{fragments/ai-chat :: ai-chat}"></section>
<div th:replace="~{fragments/data-sources :: data-sources}"></div>

<script th:if="${script == 'dashboard' or script == 'reports' or script == 'esp32-humidity'}" th:src="@{/webjars/chart.js/4.4.1/dist/chart.umd.js}"></script>
<script th:if="${script == 'dashboard' or script == 'sensor-map' or script == 'estate-map' or script == 'estate-detail'}" th:src="@{/webjars/leaflet/1.9.4/leaflet.js}"></script>
<script type="module" th:src="@{/js/app.js}"></script>
<script type="module" th:src="@{/js/ai/chat-widget.js}"></script>
<script type="module" th:src="@{/js/events/live.js}"></script>
<script th:if="${script != null}" type="module" th:src="@{|/js/${script}.js|}"></script>
</body>
</html>
