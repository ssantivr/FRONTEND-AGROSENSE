<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content, script)">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title th:text="|${title} · AgroSense|">AgroSense</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap-grid.min.css}">
    <link th:if="${script == 'dashboard' or script == 'sensor-map' or script == 'estate-map' or script == 'estate-detail'}" rel="stylesheet" th:href="@{/webjars/leaflet/1.9.4/leaflet.css}">
    <th:block th:replace="~{fragments/brand :: head-assets}"></th:block>
</head>
<body>
<a class="skip-link" href="#main">Saltar al contenido</a>
<div class="app-shell" id="appShell">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
    <!-- Dims the page behind the drawer on small screens; a click on it closes the drawer (app.js). -->
    <div class="sidebar-backdrop" aria-hidden="true"></div>
    <div class="app-main">
        <header th:replace="~{fragments/navbar :: navbar}"></header>
        <main th:replace="${content}"></main>
    </div>
</div>
<nav th:replace="~{fragments/bottom-nav :: bottom-nav}"></nav>
<dialog th:replace="~{fragments/confirm-modal :: confirm-modal}"></dialog>
<dialog th:replace="~{fragments/command-palette :: command-palette}"></dialog>
<div th:replace="~{fragments/toast :: toast}"></div>

<script th:if="${script == 'dashboard' or script == 'reports'}" th:src="@{/webjars/chart.js/4.4.1/dist/chart.umd.js}"></script>
<script th:if="${script == 'dashboard' or script == 'sensor-map' or script == 'estate-map' or script == 'estate-detail'}" th:src="@{/webjars/leaflet/1.9.4/leaflet.js}"></script>
<script type="module" th:src="@{/js/app.js}"></script>
<script th:if="${script != null}" type="module" th:src="@{|/js/${script}.js|}"></script>
</body>
</html>
