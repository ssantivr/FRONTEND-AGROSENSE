<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header class="topbar" th:fragment="navbar">
    <button type="button" class="icon-button" id="sidebarToggle" aria-controls="sidebar" aria-expanded="true"
            aria-label="Mostrar u ocultar el menú">
        <i class="bi bi-list" aria-hidden="true"></i>
    </button>

    <div class="topbar-search" id="tableSearch" hidden>
        <i class="bi bi-search" aria-hidden="true"></i>
        <input type="search" id="tableSearchInput" placeholder="Buscar en esta página"
               aria-label="Buscar en esta página" autocomplete="off">
    </div>

    <div class="topbar-spacer"></div>

    <time class="topbar-clock" id="clock" aria-label="Fecha y hora actuales"></time>

    <a class="icon-button topbar-alerts" th:href="@{/alertas}"
       th:attr="aria-label=${openAlertCount != null and openAlertCount > 0} ? |${openAlertCount} alertas sin atender| : 'Sin alertas pendientes'">
        <i class="bi bi-bell" aria-hidden="true"></i>
        <span class="topbar-dot" th:if="${openAlertCount != null and openAlertCount > 0}" aria-hidden="true"></span>
    </a>

    <div class="topbar-user">
        <span class="avatar" aria-hidden="true" sec:authentication="principal.initials">UD</span>
        <span class="topbar-user-text">
            <span class="topbar-user-name" sec:authentication="principal.displayName">Usuario Demo</span>
            <span class="topbar-user-email" sec:authentication="name">demo@agrosense.co</span>
        </span>
    </div>

    <form th:action="@{/logout}" method="post">
        <button type="submit" class="icon-button" aria-label="Cerrar sesión" title="Cerrar sesión">
            <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
        </button>
    </form>
</header>
</body>
</html>
