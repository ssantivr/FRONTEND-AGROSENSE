<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<div class="state state--error" th:fragment="error-state(title, text)" role="alert">
    <i class="bi bi-exclamation-triangle" aria-hidden="true"></i>
    <h2 th:text="${title}">No se pudo cargar</h2>
    <p th:text="${text}">Inténtalo de nuevo.</p>
</div>
</body>
</html>
