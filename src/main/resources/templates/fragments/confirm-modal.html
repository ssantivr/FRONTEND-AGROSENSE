<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Forms and buttons opt in with data-confirm="question"; see static/js/app.js. -->
<dialog class="modal" id="confirmModal" th:fragment="confirm-modal" aria-labelledby="confirmModalTitle">
    <form method="dialog" class="modal-body">
        <h2 id="confirmModalTitle">Confirmar acción</h2>
        <p id="confirmModalText">¿Deseas continuar?</p>
        <div class="modal-actions">
            <button type="submit" class="button button--ghost" value="cancel">Cancelar</button>
            <button type="submit" class="button" value="confirm">Confirmar</button>
        </div>
    </form>
</dialog>
</body>
</html>
