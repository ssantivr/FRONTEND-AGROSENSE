<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<span class="status-pill" th:fragment="status-pill(tone, icon, label)" th:classappend="|status-pill--${tone}|">
    <i class="bi" th:classappend="${icon}" aria-hidden="true"></i>
    <span th:text="${label}">Estado</span>
</span>
<span class="status-pill" th:fragment="severity-pill(severity)" th:with="level=${severity.name()}"
      th:classappend="${level == 'VERY_HIGH'} ? 'status-pill--critical' : (${level == 'HIGH'} ? 'status-pill--danger' : (${level == 'MEDIUM'} ? 'status-pill--warning' : 'status-pill--info'))">
    <i class="bi" aria-hidden="true"
       th:classappend="${level == 'VERY_HIGH'} ? 'bi-exclamation-octagon-fill' : (${level == 'HIGH'} ? 'bi-exclamation-triangle-fill' : (${level == 'MEDIUM'} ? 'bi-exclamation-circle' : 'bi-info-circle'))"></i>
    <span th:text="#{${'severity.' + level}}">Advertencia</span>
</span>
<span class="status-pill" th:fragment="sensor-status(sensor)" th:with="status=${sensor.status()}"
      th:classappend="|status-pill--${status.tone()}|" th:title="#{${'sensorStatusHint.' + status}(${sensorThresholds.staleAfterText()},${sensorThresholds.offlineAfterText()})}"
      th:attr="data-sensor-status=${status}">
    <i class="bi" th:classappend="${status.icon()}" aria-hidden="true"></i>
    <span th:text="#{${'sensorStatus.' + status}}">En línea</span>
</span>
</body>
</html>
