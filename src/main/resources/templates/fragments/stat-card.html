<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<article class="card stat-card" th:fragment="stat-card(label, value, unit, hint, icon, featured, spark, range)"
         th:classappend="${featured} ? 'stat-card--featured'">
    <span class="stat-icon" aria-hidden="true"><i class="bi" th:classappend="${icon}"></i></span>
    <span class="stat-label" th:text="${label}">Indicador</span>
    <span class="stat-value">
        <span th:text="${value != null ? value : '—'}" th:attr="data-countup=${value != null} ? ${label} : null">0</span>
        <span class="stat-unit" th:if="${value != null and unit != null}" th:text="${unit}">%</span>
    </span>
    <span class="stat-hint" th:text="${hint}">Detalle</span>
    <time class="stat-updated" th:if="${statUpdatedAt != null}" th:datetime="${statUpdatedAt}"
          th:text="|Actualizado a las ${#temporals.format(statUpdatedAt, 'HH:mm')}|">Actualizado a las 10:00</time>
    <svg class="sparkline" th:if="${spark != null}" viewBox="0 0 100 28" preserveAspectRatio="none"
         aria-hidden="true" focusable="false">
        <polyline th:points="${spark}" points="0,14 100,14"/>
    </svg>
    <span class="range" th:if="${range != null}">
        <svg class="range-bar" viewBox="0 0 100 8" preserveAspectRatio="none" aria-hidden="true" focusable="false">
            <rect class="range-track" x="0" y="3" width="100" height="2"/>
            <rect class="range-band" y="3" height="2" th:x="${range.min}" th:width="${range.max - range.min}"/>
            <rect class="range-mark" y="0" height="8" width="1.4" th:x="${range.value - 0.7}"/>
        </svg>
        <span class="range-text">
            <span th:text="|Rango del cultivo: ${range.minLabel} – ${range.maxLabel} ${unit}|">Rango: 40 – 80 %</span>
            <strong th:text="${range.within} ? 'Dentro del rango' : 'Fuera del rango'">Dentro del rango</strong>
        </span>
    </span>
</article>

<article class="card stat-card kpi-card" th:fragment="kpi-card(summary, range, members)" data-kpi
         th:data-kpi-type="${summary.type}"
         th:with="label=#{${'sensorType.' + summary.type}},
                  value=${#numbers.formatDecimal(summary.value, 1, 1, 'COMMA')}">
    <span class="stat-icon" aria-hidden="true"><i class="bi" th:classappend="${summary.icon()}"></i></span>
    <span class="stat-label" th:text="${label}">Humedad del suelo</span>
    <span class="stat-value" aria-live="polite">
        <span data-kpi-value th:text="${value}" th:attr="data-countup=${label}">55,0</span>
        <span class="stat-unit" th:if="${summary.unit != null}" th:text="${summary.unit}">%</span>
    </span>
    <span class="kpi-status">
        <span class="kpi-trend" data-live-trend hidden>
            <i class="bi" aria-hidden="true"></i><span data-live-trend-label></span>
        </span>
        <span class="source-chip" data-live-source hidden>
            <i class="bi" aria-hidden="true"></i><span data-live-source-label></span>
        </span>
    </span>
    <span class="stat-hint"
          th:text="${summary.sensorCount == 1} ? 'Última lectura de 1 sensor' : |Promedio de la última lectura de ${summary.sensorCount} sensores|">
        Promedio de la última lectura de 2 sensores</span>
    <time class="kpi-time" data-kpi-time th:if="${summary.lastReadingAt != null}" th:datetime="${summary.lastReadingAt}">
        <i class="bi bi-clock" aria-hidden="true"></i>
        <span data-kpi-time-label th:text="|Última lectura: ${#temporals.format(summary.lastReadingAt, 'd MMM, HH:mm')}|">Última lectura: 17 oct, 10:00</span>
    </time>
    <svg class="sparkline" data-live-spark viewBox="0 0 100 28" preserveAspectRatio="none" role="img" focusable="false"
         th:attr="aria-label=|Tendencia de ${label} en las últimas 24 horas|,hidden=${summary.sparkline == null ? 'hidden' : null}">
        <polyline th:points="${summary.sparkline ?: ''}" points="0,14 100,14"/>
    </svg>
    <span class="range" th:if="${range != null}">
        <svg class="range-bar" viewBox="0 0 100 8" preserveAspectRatio="none" aria-hidden="true" focusable="false">
            <rect class="range-track" x="0" y="3" width="100" height="2"/>
            <rect class="range-band" y="3" height="2" th:x="${range.min}" th:width="${range.max - range.min}"/>
            <rect class="range-mark" y="0" height="8" width="1.4" th:x="${range.value - 0.7}"/>
        </svg>
        <span class="range-text">
            <span th:text="|Umbral del cultivo: ${range.minLabel} – ${range.maxLabel} ${summary.unit}|">Umbral: 40 – 80 %</span>
            <strong th:text="${range.within} ? 'Dentro del rango' : 'Fuera del rango'">Dentro del rango</strong>
        </span>
    </span>
    <time class="stat-updated" data-live-updated th:if="${statUpdatedAt != null}"
          th:datetime="${statUpdatedAt}" th:text="|Actualizado a las ${#temporals.format(statUpdatedAt, 'HH:mm')}|">Actualizado a las 10:00</time>
    <data hidden th:each="member : ${members}" th:value="${member.lastValue}"
          th:attr="data-kpi-member=${member.code}"></data>
</article>
</body>
</html>
