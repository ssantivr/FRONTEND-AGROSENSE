<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- featured: true for the one indicator the page leads with.
     spark: points of an SVG polyline (see Sparkline), or null for no trend line.
     range: a Views.RangeBar placing the value against an acceptable range, or null. -->
<article class="card stat-card" th:fragment="stat-card(label, value, unit, hint, icon, featured, spark, range)"
         th:classappend="${featured} ? 'stat-card--featured'">
    <span class="stat-icon" aria-hidden="true"><i class="bi" th:classappend="${icon}"></i></span>
    <span class="stat-label" th:text="${label}">Indicador</span>
    <span class="stat-value">
        <!-- data-countup: app.ts counts from the value last shown in this browser to this one, when it changed. -->
        <span th:text="${value != null ? value : '—'}" th:attr="data-countup=${value != null} ? ${label} : null">0</span>
        <span class="stat-unit" th:if="${value != null and unit != null}" th:text="${unit}">%</span>
    </span>
    <span class="stat-hint" th:text="${hint}">Detalle</span>
    <svg class="sparkline" th:if="${spark != null}" viewBox="0 0 100 28" preserveAspectRatio="none"
         aria-hidden="true" focusable="false">
        <polyline th:points="${spark}" points="0,14 100,14"/>
    </svg>
    <!-- The band is the acceptable range and the mark is the value; the text says the same in words. -->
    <span class="range" th:if="${range != null}">
        <svg class="range-bar" viewBox="0 0 100 8" preserveAspectRatio="none" aria-hidden="true" focusable="false">
            <rect class="range-track" x="0" y="3" width="100" height="2"/>
            <rect class="range-band" y="3" height="2" th:x="${range.min}" th:width="${range.max - range.min}"/>
            <rect class="range-mark" y="0" height="8" width="1.4" th:x="${range.value - 0.7}"/>
        </svg>
        <span class="range-text">
            <span th:text="|Rango del cultivo: ${range.minLabel} – ${range.maxLabel} ${unit}|">Rango: 40 – 80 %</span>
            <strong th:text="${range.within} ? 'Dentro del rango' : 'Fuera del rango'">Dentro del rango</strong>
        </span>
    </span>
</article>
</body>
</html>
