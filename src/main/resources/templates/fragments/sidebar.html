<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<aside class="sidebar on-panel" id="sidebar" th:fragment="sidebar" aria-label="Navegación principal">
    <a class="brand-logo sidebar-brand" th:href="@{/}" aria-label="AgroSense, ir al inicio">
        <svg th:replace="~{fragments/brand :: mark(34, false)}"></svg>
        <span class="sidebar-brand-text">
            <span class="brand-logo-name">Agro<span class="brand-logo-accent">Sense</span></span>
            <span class="sidebar-brand-tagline">Agricultura de precisión</span>
        </span>
    </a>
    <nav>
        <ul class="sidebar-nav">
            <li th:each="item : ${navigation}">
                <a class="sidebar-link" th:href="@{${item.path}}"
                   th:attr="aria-current=${item.active ? 'page' : null}" th:title="${item.label}">
                    <!-- Shares one view-transition name across pages, so it slides to the newly active item. -->
                    <span class="sidebar-marker" th:if="${item.active}" aria-hidden="true"></span>
                    <i class="bi" th:classappend="${item.icon}" aria-hidden="true"></i>
                    <span class="sidebar-link-label" th:text="${item.label}">Inicio</span>
                    <span class="sidebar-badge" th:if="${item.path == '/alertas' and openAlertCount != null and openAlertCount > 0}"
                          th:text="${openAlertCount}"
                          th:attr="aria-label=|${openAlertCount} alertas sin atender|">3</span>
                </a>
            </li>
        </ul>
    </nav>
    <p class="sidebar-demo" th:if="${demoMode}">
        <i class="bi bi-info-circle" aria-hidden="true"></i>
        <span class="sidebar-link-label">Vista de demostración con datos de ejemplo</span>
    </p>
</aside>
</body>
</html>
