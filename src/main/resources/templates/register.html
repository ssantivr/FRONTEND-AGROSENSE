<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/auth-layout :: auth('Crear cuenta', ~{::form})}">
<body>
<form class="login-card" th:action="@{/registro}" method="post" th:object="${registrationForm}" novalidate>
    <h2>Crear cuenta</h2>
    <p class="text-muted">Regístrate para empezar a usar AgroSense.</p>

    <p class="form-alert form-alert--error" role="alert" th:each="error : ${#fields.globalErrors()}">
        <i class="bi bi-exclamation-circle" aria-hidden="true"></i>
        <span th:text="${error}">Error</span>
    </p>

    <div class="field-row">
        <label class="field">
            <span class="field-label">Nombre</span>
            <input type="text" th:field="*{name}" autocomplete="given-name" maxlength="80" required autofocus
                   th:attr="aria-invalid=${#fields.hasErrors('name')}">
            <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Error</span>
        </label>
        <label class="field">
            <span class="field-label">Apellido</span>
            <input type="text" th:field="*{lastName}" autocomplete="family-name" maxlength="80" required
                   th:attr="aria-invalid=${#fields.hasErrors('lastName')}">
            <span class="field-error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}">Error</span>
        </label>
    </div>

    <label class="field">
        <span class="field-label">Correo electrónico</span>
        <input type="email" th:field="*{email}" autocomplete="username" maxlength="160" required
               th:attr="aria-invalid=${#fields.hasErrors('email')}">
        <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Error</span>
    </label>

    <label class="field">
        <span class="field-label">Contraseña</span>
        <span class="field-with-action">
            <!-- Passwords are never echoed back into the form after a failed submit. -->
            <input type="password" name="password" id="password" autocomplete="new-password" minlength="8"
                   maxlength="72" required th:attr="aria-invalid=${#fields.hasErrors('password')}">
            <button type="button" class="icon-button" data-toggle-password="password" aria-pressed="false"
                    aria-label="Mostrar contraseña">
                <i class="bi bi-eye" aria-hidden="true"></i>
            </button>
        </span>
        <span class="field-hint">Entre 8 y 72 caracteres.</span>
        <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Error</span>
    </label>

    <label class="field">
        <span class="field-label">Confirmar contraseña</span>
        <input type="password" name="confirmPassword" autocomplete="new-password" maxlength="72" required
               th:attr="aria-invalid=${#fields.hasErrors('passwordConfirmed')}">
        <span class="field-error" th:if="${#fields.hasErrors('passwordConfirmed')}"
              th:errors="*{passwordConfirmed}">Error</span>
    </label>

    <button type="submit" class="button button--block">Crear cuenta</button>

    <p class="auth-switch">¿Ya tienes cuenta? <a class="link" th:href="@{/login}">Iniciar sesión</a></p>
</form>
</body>
</html>
