<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Error · AgroSense</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/img/logo.svg}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="error-page">
<main class="card error-card">
    <p class="error-code" th:text="${status ?: 'Error'}">404</p>
    <div th:replace="~{fragments/error-state :: error-state(
        ${status == 404 ? 'Página no encontrada' : (status == 403 ? 'Acceso denegado' : 'Algo salió mal')},
        ${message ?: (status == 404 ? 'No encontramos lo que buscabas.' : (status == 403 ? 'No tienes permiso para realizar esta acción.' : 'Ocurrió un error inesperado. Inténtalo de nuevo.'))})}"></div>
    <a class="button" th:href="@{/}">Volver al inicio</a>
</main>
</body>
</html>
