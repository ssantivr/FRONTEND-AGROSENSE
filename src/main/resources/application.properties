spring.application.name=agrosense-frontend
server.port=${PORT:8080}

# Everything about the database (connection, schema, sample data) is configured in the workspace's
# /database folder. DATABASE_DIR overrides its location when the app is not started from /frontend.
agrosense.database.dir=${DATABASE_DIR:../database}
spring.config.import=file:${DATABASE_DIR:../database}/datasource.properties

spring.web.locale=es_CO
spring.web.locale-resolver=fixed
spring.messages.fallback-to-system-locale=false

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.timeout=30m
server.error.include-stacktrace=never
server.error.include-message=never
