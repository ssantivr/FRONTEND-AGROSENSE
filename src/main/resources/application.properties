spring.application.name=agrosense-frontend
server.port=${PORT:8080}

# Everything about the database (connection, schema, sample data) is configured in the workspace's
# /database folder. DATABASE_DIR overrides its location when the app is not started from /frontend.
agrosense.database.dir=${DATABASE_DIR:../database}
spring.config.import=file:${DATABASE_DIR:../database}/datasource.properties

spring.web.locale=es_CO
spring.web.locale-resolver=fixed
spring.messages.fallback-to-system-locale=false

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.timeout=30m
# Sessions live in the database, not in the memory of one process: hosts that stop idle instances or run
# several would otherwise log users out. Their tables (spring_session*) come from database/schema.sql
# like every other table, so the library must not create them itself.
spring.session.jdbc.initialize-schema=never
# Backend API, used for the operations it offers (acknowledging alerts, registering sensors and
# irrigations, sensor readings); everything else, and all of it while the backend does not answer, reads
# the database. Off unless both are set. BACKEND_JWT_SECRET must equal the backend's JWT_SECRET.
agrosense.backend.url=${BACKEND_URL:}
agrosense.backend.jwt-secret=${BACKEND_JWT_SECRET:}
# Sign-in and sign-up also go through the backend while it answers, so its limit on failed attempts
# applies here. Every sign-in then reaches the backend from this server's address: set the backend's
# LOGIN_MAX_ATTEMPTS_PER_ADDRESS=0, or one visitor's failures would lock everybody out. false keeps
# sign-in on the database only.
agrosense.backend.sign-in=${BACKEND_SIGN_IN:true}
# Static files. Stylesheets and scripts are revalidated on every use; fonts, images and WebJars are kept
# for longer (StaticResourceConfig). Text answers are compressed.
spring.web.resources.cache.cachecontrol.no-cache=true
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=1024
server.error.include-stacktrace=never
server.error.include-message=never

# Voice messages for the assistant are forwarded to the backend; a recording is a few hundred kilobytes.
spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=5MB
