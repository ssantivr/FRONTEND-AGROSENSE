spring.application.name=agrosense-frontend
server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/agrosense_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
# No default on purpose: credentials must come from the environment, never from this file.
spring.datasource.password=${DATABASE_PASSWORD}

# Tables come from /database/schema.sql at the workspace root; Hibernate only validates them.
# Set SQL_INIT_MODE=always to apply that (idempotent) script at startup.
spring.sql.init.mode=${SQL_INIT_MODE:never}
spring.sql.init.schema-locations=${SCHEMA_LOCATION:file:../database/schema.sql}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.web.locale=es_CO
spring.web.locale-resolver=fixed
spring.messages.fallback-to-system-locale=false

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.timeout=30m
server.error.include-stacktrace=never
server.error.include-message=never
