# Demo profile: in-memory database with sample data, for local use only.
spring.datasource.url=jdbc:h2:mem:agrosense-demo;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
# Same tables as production: created from /database/schema.sql, with H2 emulating PostgreSQL.
spring.sql.init.mode=always

# Local demo runs over plain HTTP, where a Secure cookie would never be sent back.
server.servlet.session.cookie.secure=false

agrosense.demo.email=demo@agrosense.co
agrosense.demo.password=${DEMO_PASSWORD:agrosense}
