# Demo profile, for local use only. Its database settings are in /database/datasource.properties.

# Local demo runs over plain HTTP, where a Secure cookie would never be sent back.
server.servlet.session.cookie.secure=false

# Password given at startup to the demo user that /database/seed_demo.sql creates.
agrosense.demo.password=${DEMO_PASSWORD:agrosense}

# Local and demo runs serve every template and static file fresh, so a changed design shows on reload.
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0
spring.web.resources.cache.cachecontrol.no-store=true
spring.web.resources.chain.cache=false
# Stylesheet links carry a hash of their content. Scripts keep plain names: they are ES modules that
# import each other by relative path, and a hashed name would load app.js twice.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/css/**
