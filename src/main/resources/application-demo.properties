# Demo profile: in-memory database with sample data, for local use only.
spring.datasource.url=jdbc:h2:mem:agrosense-demo;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Local demo runs over plain HTTP, where a Secure cookie would never be sent back.
server.servlet.session.cookie.secure=false

agrosense.demo.email=demo@agrosense.co
agrosense.demo.password=${DEMO_PASSWORD:agrosense}
