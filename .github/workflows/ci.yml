# Every push and pull request: the Java build with its tests (the PostgreSQL ones are skipped without a
# database; neon-pull-request.yml runs them), the TypeScript check, and a check that the compiled scripts in
# src/main/resources/static/js match their sources, since they are committed.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      # The application reads the schema and the sample data from ../database, which is its own repository.
      - name: Check out the frontend
        uses: actions/checkout@v5
        with:
          path: frontend
      - name: Check out the database folder
        uses: actions/checkout@v5
        with:
          repository: ssantivr/BASE-DE-DATOS-AGROSENSE
          path: database
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: frontend/pom.xml
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check the TypeScript
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
      - name: Check that the compiled scripts are up to date
        working-directory: frontend
        run: |
          npm run build
          git diff --exit-code -- src/main/resources/static/js
      - name: Build and run the tests
        working-directory: frontend
        run: |
          # The wrapper is stored without the executable bit and may carry Windows line endings.
          sed -i 's/\r$//' mvnw
          chmod +x mvnw
          ./mvnw -q -B verify
